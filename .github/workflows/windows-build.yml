# Builds the game on every push to main (or by hand, from the Actions tab):
# runs the tests; exports NightfallOutpost.exe, zips it with "HOW TO PLAY.txt"
# and puts it on the rolling "Latest Windows build" release; and exports the
# browser version and publishes it on GitHub Pages
# (https://reesegodwin.github.io/zombie_defence/).
name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: windows-build
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and its export templates
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-windows-web

      - name: Download Godot and the Windows and web export templates
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -e
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot
          curl -sSL -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          curl -sSL -o /tmp/templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dest"
          unzip -q -j /tmp/templates.tpz "templates/windows_release_x86_64.exe" "templates/windows_debug_x86_64.exe" "templates/web_nothreads_release.zip" "templates/web_nothreads_debug.zip" "templates/version.txt" -d "$dest"

      - name: Import the project
        run: ~/godot/godot --headless --path . --import || true

      - name: Run the tests
        run: |
          ~/godot/godot --headless --path . --script res://tests/sim_test.gd | tee test.log
          grep -q "RESULT: OK" test.log
          ~/godot/godot --headless --path . --script res://tests/gait_check.gd | tee gait.log
          grep -q "RESULT: OK" gait.log

      - name: Bake the sounds and terrain (faster start-up)
        run: |
          ~/godot/godot --headless --path . --script res://tools/bake.gd
          test -s assets/baked/sounds.res && test -s assets/baked/terrain.res
          ~/godot/godot --headless --path . --import || true

      - name: Add GodotSteam (Steam invites for co-op)
        # The add-on's own builds: the newest GDExtension plugin, from its
        # GitHub releases or (where it's moved) Codeberg. If it can't be had,
        # the game is built without Steam (co-op still works by address).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          pick() {
            python3 -c "
          import json, sys
          rels = json.load(sys.stdin)
          for r in rels if isinstance(rels, list) else []:
              for a in r.get('assets', []):
                  n = a.get('name', '').lower()
                  if n.endswith('.zip') and 'gdextension' in n and 'plugin' in n:
                      print(a.get('browser_download_url')); sys.exit(0)
          "
          }
          url=$(curl -sSL -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/GodotSteam/GodotSteam/releases?per_page=20" | pick)
          if [ -z "$url" ]; then
            url=$(curl -sSL "https://codeberg.org/api/v1/repos/godotsteam/godotsteam/releases?limit=20" | pick)
          fi
          echo "GodotSteam download: ${url:-none found}"
          if [ -n "$url" ] && curl -sSL -o /tmp/godotsteam.zip "$url" && unzip -q -o /tmp/godotsteam.zip -d /tmp/godotsteam; then
            src=$(find /tmp/godotsteam -type d -path "*addons/godotsteam" | head -1)
            if [ -n "$src" ]; then
              mkdir -p addons && cp -r "$src" addons/
              ls -R addons/godotsteam | head -40
              ~/godot/godot --headless --path . --import > /dev/null 2>&1
              ~/godot/godot --headless --path . --script res://tools/steam_check.gd
            else
              echo "::warning::GodotSteam zip had no addons/godotsteam: building without Steam"
            fi
          else
            echo "::warning::Couldn't get GodotSteam: building without Steam"
          fi
          exit 0

      - name: Export the Windows exe
        run: |
          mkdir -p export
          ~/godot/godot --headless --path . --export-release "Windows Desktop" export/NightfallOutpost.exe
          test -s export/NightfallOutpost.exe

      - name: Zip it
        run: |
          cp "dist/HOW TO PLAY.txt" export/
          # Steam: the test app's ID next to the exe, so it runs outside Steam too.
          if [ -d addons/godotsteam ]; then echo 480 > export/steam_appid.txt; fi
          cd export
          zip -9 -q NightfallOutpost-windows.zip NightfallOutpost.exe "HOW TO PLAY.txt" $(ls *.dll steam_appid.txt 2>/dev/null)
          unzip -l NightfallOutpost-windows.zip
          ls -la

      - name: Attach the zip to this run
        uses: actions/upload-artifact@v4
        with:
          name: NightfallOutpost-windows
          path: export/NightfallOutpost-windows.zip

      - name: Update the "Latest Windows build" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes="Built automatically from ${GITHUB_SHA::7} on $(date -u '+%Y-%m-%d %H:%M UTC').

          Download **NightfallOutpost-windows.zip**, unzip it, and double-click **NightfallOutpost.exe**. Nothing to install.
          The first time, Windows may say \"Windows protected your PC\" (the game isn't signed): click **More info**, then **Run anyway**.
          If **Smart App Control** blocks it, play in your browser instead: https://reesegodwin.github.io/zombie_defence/"
          git tag -f windows-latest "$GITHUB_SHA"
          git push -f origin windows-latest
          if gh release view windows-latest > /dev/null 2>&1; then
            gh release edit windows-latest --title "Latest Windows build" --notes "$notes"
          else
            gh release create windows-latest --title "Latest Windows build" --notes "$notes" --latest
          fi
          gh release upload windows-latest export/NightfallOutpost-windows.zip --clobber

      - name: Export the browser version
        run: |
          # (No Steam in a browser: the add-on stays out of this build.)
          rm -rf addons/godotsteam && ~/godot/godot --headless --path . --import > /dev/null 2>&1 || true
          mkdir -p export/web
          ~/godot/godot --headless --path . --export-release "Web" export/web/index.html
          test -s export/web/index.html

      - name: Upload it for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: export/web

  pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publish on GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
